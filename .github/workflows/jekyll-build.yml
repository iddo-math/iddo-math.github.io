# Workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll Site to Pages

# 1. Triggers the workflow on pushes to the default branch (e.g., 'main')
on:
  push:
    branches: ["gh-pages"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write # Required to deploy to GitHub Pages
  id-token: write # Required for the actions/deploy-pages action

# Allow only one concurrent deployment, skipping runs queued between the latest run and the one currently running.
# However, do NOT cancel in-progress runs as we want to allow deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch all history for use in Jekyll plugins, etc.
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2" # Adjust if your Jekyll project requires a different version
          bundler-cache: true # Install dependencies with bundle install
          cache-version: 1

      - name: Install Dependencies
        run: bundle install

      - name: Build Jekyll Site
        # Runs the Jekyll build command. The built site is placed in the '_site' directory.
        run: bundle exec jekyll build --lsi

      - name: Setup Pages
        # Configures the job to work with GitHub Pages.
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        # Uploads the built static files as an artifact named 'github-pages'
        uses: actions/upload-pages-artifact@v3
        with:
          # The contents of the _site directory will be uploaded.
          path: './_site'

  # Deployment job
  deploy:
    # Requires the 'build' job to complete successfully first
    needs: build
    environment:
      # Specifies the target environment as 'github-pages'
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # Uses the official action to deploy the uploaded artifact
        uses: actions/deploy-pages@v4