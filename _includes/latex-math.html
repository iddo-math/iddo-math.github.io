<!-- MathJax v4: config FIRST -->
<script>
  window.MathJax = {
    loader: { load: ['[tex]/tagformat'] },
    tex: {
      packages: ['base', 'ams', 'tagformat'],
      tags: 'ams',
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      tagformat: {
        number: (n) => (MathJax.config._currentSection || 0) + '.' + n,
        id: (tag) => 'eqn-' + tag
      }
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>

<!-- Theorem/Figure Parser (Patched for multiple sec-blocks and correct reference replacement) -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  const SECTION_LEVEL = 2; // Adjust if you use different heading levels for sections
  const SHARED_GROUPS = [
    {
      groupName: 'thm',
      defaultTitle: 'Theorem',
      kinds: ['theorem','lemma','proposition','corollary'],
      titleByKind: {
        lemma: 'Lemma',
        proposition: 'Proposition',
        corollary: 'Corollary'
      }
    }
  ];
  const SOLO_KINDS = [
    { name: 'definition', title: 'Definition' },
    { name: 'remark',     title: 'Remark' },
    { name: 'example',    title: 'Example' },
    { name: 'proof',      title: 'Proof', number: false }
  ];
  const FIGURE_TITLE = 'Figure';
  const ADD_QED = true;
  const refMap = new Map();

  function parseWidth(opt) {
    if (!opt) return '';
    const m = opt.match(/width\s*=\s*([0-9.]+)\\textwidth/i);
    if (m) return (parseFloat(m[1]) * 100) + '%';
    const p = opt.match(/width\s*=\s*([0-9.]+%)/i);
    return p ? p[1] : '';
  }

  // Only wrap if not already .sec-block (for backward compatibility)
  function alreadyWrapped(root) {
    return !!root.querySelector('.sec-block');
  }

  function wrapSections(root) {
    if (alreadyWrapped(root)) return Array.from(root.querySelectorAll('.sec-block'));
    const level = Math.max(1, Math.min(6, SECTION_LEVEL));
    const headings = [...root.querySelectorAll(`h${level}`)];
    if (headings.length === 0) {
      const wrap = document.createElement('div');
      wrap.className = 'sec-block';
      wrap.dataset.sec = '1';
      while (root.firstChild) wrap.appendChild(root.firstChild);
      root.appendChild(wrap);
      return [wrap];
    }
    const wraps = [];
    for (let i = 0; i < headings.length; i++) {
      const h = headings[i];
      const lab = h.innerHTML.match(/\\label\{([^}]+)\}/);
      if (lab) {
        h.id = lab[1];
        h.innerHTML = h.innerHTML.replace(lab[0], '');
      }
      const wrap = document.createElement('div');
      wrap.className = 'sec-block';
      wrap.dataset.sec = String(i + 1);

      if (h.parentNode === root) {
        root.insertBefore(wrap, h);
      } else {
        root.appendChild(wrap);
      }

      let node = h;
      while (node) {
        const next = node.nextSibling;
        wrap.appendChild(node);
        if (!next) break;
        if (next.nodeType === 1 && next.tagName.toLowerCase() === `h${level}`) break;
        node = next;
      }
      wraps.push(wrap);
    }
    return wraps;
  }

  function processSection(wrap, secNo) {
    const sharedCounts = {};
    SHARED_GROUPS.forEach(g => sharedCounts[g.groupName] = 0);
    const soloCounts = {};
    SOLO_KINDS.forEach(k => soloCounts[k.name] = 0);

    const allKinds = [...SHARED_GROUPS.flatMap(g => g.kinds), ...SOLO_KINDS.map(k => k.name)];
    const envRegex = new RegExp(
      String.raw`\\begin\{(${allKinds.join('|')})\}(?:\[(.*?)\])?([\s\S]*?)\\end\{\1\}`,
      'g'
    );

    let html = wrap.innerHTML;
    html = html.replace(envRegex, (_, kind, optTitle, body) => {
      let label = null;
      body = body.replace(/\\label\{([^}]+)\}/, (m, id) => { label = id; return ''; });
      const sg = SHARED_GROUPS.find(g => g.kinds.includes(kind));
      const sk = SOLO_KINDS.find(k => k.name === kind);
      let title = (sg && sg.titleByKind[kind]) || (sg && sg.defaultTitle) || (sk && sk.title) || 'Theorem';
      let number = '';
      let isNumbered = true;

      if (sg) {
        sharedCounts[sg.groupName]++;
        number = `${secNo}.${sharedCounts[sg.groupName]}`;
      } else if (sk) {
        if (sk.number === false) {
          isNumbered = false;
        } else {
          soloCounts[sk.name]++;
          number = `${secNo}.${soloCounts[sk.name]}`;
        }
      }

      if (kind === 'proof' && ADD_QED && !/\\qedhere/.test(body)) {
        body += ' \\qquad \\square';
      }

      const heading = isNumbered ? `${title} ${number}${optTitle ? ' (' + optTitle + ')' : ''}` : `${title}.`;
      if (label && isNumbered) refMap.set(label, { text: `${title} ${number}`, id: label });
      return `<section class="${kind}"${label ? ` id="${label}"` : ''}>
        <div class="thm-heading">${heading}</div>${body.trim()}
      </section>`;
    });

    // Figure environment
    const figRegex = /\\begin\{figure\}(?:\[(.*?)\])?([\s\S]*?)\\end\{figure\}/g;
    let figCount = 0;
    html = html.replace(figRegex, (_, opt, body) => {
      let label = null;
      body = body.replace(/\\label\{([^}]+)\}/, (m, id) => { label = id; return ''; });
      figCount++;
      const number = `${secNo}.${figCount}`;
      const width = parseWidth(opt || '');
      if (label) refMap.set(label, { text: `${FIGURE_TITLE} ${number}`, id: label });
      return `<figure${label ? ` id="${label}"` : ''} style="${width ? `max-width:${width};` : ''}">
        <figcaption>${FIGURE_TITLE} ${number}</figcaption>
        ${body.trim()}
      </figure>`;
    });

    wrap.innerHTML = html;
  }

  // Reference replacement: \ref{label} --> Theorem 1.1, etc.
  // Now works **outside** of sections/figures, for all .sec-blocks
  function replaceRefs(root) {
    // Replace \ref{...} in all text nodes within root
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT, null, false);
    while (walker.nextNode()) {
      const el = walker.currentNode;
      // Only replace in elements without children (leaf nodes) or in "p"/"span"/"div" type elements
      if (el.children.length === 0 || ['P','SPAN','DIV'].includes(el.tagName)) {
        if (el.innerHTML && el.innerHTML.includes('\\ref{')) {
          el.innerHTML = el.innerHTML.replace(/\\ref\{([^}]+)\}/g, (_, label) => {
            if (refMap.has(label)) {
              const ref = refMap.get(label);
              return `<a href="#${ref.id}" class="thm-ref">${ref.text}</a>`;
            }
            return `<span class="thm-ref thm-missing">??</span>`;
          });
        }
      }
    }
  }

  // --- MAIN EXECUTION ---
  // 1. Find all section blocks (already wrapped)
  const secBlocks = Array.from(document.querySelectorAll('.sec-block'));
  let sectionOffset = 0;
  secBlocks.forEach((block, i) => {
    // Here, i+1 is used as section number
    processSection(block, i + 1);
    sectionOffset++;
  });

  // 2. Replace references in all .sec-blocks
  secBlocks.forEach(block => replaceRefs(block));

  // 3. Re-typeset MathJax (v4) after DOM modifications
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise();
  }
});
</script>
