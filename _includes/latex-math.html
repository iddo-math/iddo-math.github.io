<script>
  window.MathJax = {
    loader: { load: ['[tex]/tagformat'] },
    tex: {
      packages: { '[+]': ['tagformat'] },
      // LaTeX-like auto numbering + \label \ref \eqref
      tags: 'ams',
      // Enable $...$ inline math (off by default)
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      // Show equation tags as <section>.<n>
      tagformat: {
        number: (n) => (MathJax.config._currentSection || 0) + '.' + n,
        id: (tag) => 'eqn-' + tag
      }
    }
  };
</script>

<!-- ======= Parser (same as Option A) ======= -->
<!-- _includes/latex-math.html  (Parser-only: no MathJax loader here) -->
<script>
/** CONFIG *********************************************************************
 * Heading level that starts a new "section" for numbering (2 => <h2>, 3 => <h3>, …)
 *****************************************************************************/
const SECTION_LEVEL = 2;

/** Shared counters per section (amsthm-like sharing) **************************/
const SHARED_GROUPS = [
  {
    groupName: 'thm',
    defaultTitle: 'Theorem',
    kinds: ['theorem','lemma','proposition','corollary'],
    titleByKind: {
      theorem: 'Theorem',
      lemma: 'Lemma',
      proposition: 'Proposition',
      corollary: 'Corollary'
    }
  }
];

/** Solo kinds (own counters per section; set number:false to keep unnumbered) **/
const SOLO_KINDS = [
  { name: 'definition', title: 'Definition' },
  { name: 'remark',     title: 'Remark'    },
  { name: 'example',    title: 'Example'   },
  { name: 'proof',      title: 'Proof', number: false } // unnumbered by default
];

/** Figure label ****************************************************************/
const FIGURE_TITLE = 'Figure';

/** Add □ to proofs unless \qedhere present ************************************/
const ADD_QED = true;

/** Debug logging ***************************************************************/
const DEBUG = false;
</script>

<script>
(function () {
  // ---------- utilities ----------
  function log(...a){ if (DEBUG && window.console) console.log('[latex-math]', ...a); }
  function contentRoot(){
    return document.querySelector('main, article, #content') || document.body;
  }
  function protectCode(root){
    const saved = [];
    root.querySelectorAll('pre, code, script, style').forEach((el, i) => {
      const token = `__CODEBIN_${i}__`;
      saved.push({ token, html: el.outerHTML });
      const span = document.createElement('span'); span.textContent = token;
      el.replaceWith(span);
    });
    return saved;
  }
  function restoreCode(root, saved){
    let html = root.innerHTML;
    for (const {token, html:frag} of saved) html = html.replace(token, frag);
    root.innerHTML = html;
  }
  function extractLabel(s){
    let label = null;
    s = s.replace(/\\label\{([^}]+)\}/, (m,id)=>{ label=id; return ''; });
    return { s, label };
  }
  function parseWidth(opt){
    if (!opt) return '';
    const m = opt.match(/width\s*=\s*([0-9.]+)\\textwidth/i);
    if (m) return (parseFloat(m[1]) * 100) + '%';
    const p = opt.match(/width\s*=\s*([0-9.]+%)/i);
    return p ? p[1] : '';
  }

  // ---------- wrap into section blocks ----------
  function wrapSections(root){
    const L = Math.max(1, Math.min(6, (window.SECTION_LEVEL||2)));
    const hs = [...root.querySelectorAll(`h${L}`)];
    if (hs.length === 0){
      const w = document.createElement('div');
      w.className = 'sec-block'; w.dataset.sec = '1';
      while (root.firstChild) w.appendChild(root.firstChild);
      root.appendChild(w);
      log('No h'+L+' found; wrapped all as section 1');
      return [w];
    }
    const wraps = [];
    for (let i=0;i<hs.length;i++){
      const h = hs[i];
      // allow \label{sec:...} inside heading
      const lab = h.innerHTML.match(/\\label\{([^}]+)\}/);
      if (lab){ h.id = lab[1]; h.innerHTML = h.innerHTML.replace(lab[0],''); }
      const w = document.createElement('div'); w.className='sec-block'; w.dataset.sec=String(i+1);

      // pull nodes until next h{L}
      let node = h;
      while (node){
        const next = node.nextSibling;
        w.appendChild(node);
        if (!next) break;
        if (next.nodeType===1 && next.tagName.toLowerCase()===`h${L}`) break;
        node = next;
      }
      root.insertBefore(w, w.firstChild);
      wraps.push(w);
    }
    return wraps;
  }

  // ---------- core parsing ----------
  const refMap = new Map(); // label -> {text,id}

  function processSection(wrap, secNo){
    // counters per section
    const shared = {}; SHARED_GROUPS.forEach(g => shared[g.groupName]=0);
    const solo = {}; SOLO_KINDS.forEach(k=> solo[k.name]=0);

    const allKinds = [
      ...SHARED_GROUPS.flatMap(g=>g.kinds),
      ...SOLO_KINDS.map(k=>k.name)
    ];

    // Case-insensitive env names; allow whitespace
    const envRe = new RegExp(
      String.raw`\\begin\{\s*(${allKinds.join('|')})\s*\}(?:\[(.*?)\])?([\\s\\S]*?)\\end\{\\s*\\1\\s*\}`,
      'gi'
    );

    let html = wrap.innerHTML;
    html = html.replace(envRe, (full, kindRaw, optTitle, body) => {
      const kind = String(kindRaw).toLowerCase();

      let { s: inner, label } = extractLabel(body);
      const sg = SHARED_GROUPS.find(g => g.kinds.includes(kind));
      const sk = SOLO_KINDS.find(k => k.name === kind);

      let isNumbered = true, numberString = '', titleText='Theorem';
      if (sg){
        shared[sg.groupName] += 1;
        numberString = `${secNo}.${shared[sg.groupName]}`;
        titleText   = sg.titleByKind[kind] || sg.defaultTitle || 'Theorem';
      } else if (sk){
        titleText = sk.title || 'Theorem';
        if (sk.number === false){ isNumbered = false; }
        else { solo[sk.name]+=1; numberString = `${secNo}.${solo[sk.name]}`; }
      } else { // fallback
        solo[kind] = (solo[kind]||0)+1;
        numberString = `${secNo}.${solo[kind]}`;
      }

      if (kind==='proof' && (typeof ADD_QED==='undefined' || ADD_QED) && !/\\qedhere/.test(inner)) {
        inner += ' \\qquad \\square';
      }
      const heading = isNumbered
        ? `${titleText} ${numberString}${optTitle ? ' ('+optTitle+')' : ''}`
        : `${titleText}.`;

      if (label && isNumbered){
        refMap.set(label, { text: `${titleText} ${numberString}`, id: label });
      }
      const idAttr = label ? ` id="${label}"` : '';
      return `<section class="${kind}"${idAttr}>
        <div class="thm-heading">${heading}</div>
        ${inner.trim()}
      </section>`;
    });

    // Figures (supports figure and figure*; case-insensitive)
    const figRe = /\\begin\{\s*figure\*?\s*\}([\s\S]*?)\\end\{\s*figure\*?\s*\}/gi;
    let figCount = 0;
    html = html.replace(figRe, (full, body) => {
      let { s: rest, label } = extractLabel(body);
      let caption = '';
      rest = rest.replace(/\\caption\{([^}]+)\}/i, (m,t)=>{ caption=t; return ''; });

      let src='', cssW='';
      rest = rest.replace(/\\includegraphics(?:\[(.*?)\])?\{([^}]+)\}/i, (m,opt,path)=>{
        src = path; cssW = parseWidth(opt); return '';
      });

      figCount += 1;
      const num = `${secNo}.${figCount}`;
      const idAttr = label ? ` id="${label}"` : '';
      if (label) refMap.set(label, { text: `${FIGURE_TITLE} ${num}`, id: label });

      const style = cssW ? ` style="max-width:100%; width:${cssW}"` : ' style="max-width:100%;"';
      return `<figure${idAttr}>
        ${src ? `<imgc}` : ''}
        <figcaption>${FIGURE_TITLE} ${num}: ${caption||''}</figcaption>
      </figure>`;
    });

    wrap.innerHTML = html;
  }

  function rewriteTextRefs(root){
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const targets = [];
    while (walker.nextNode()){
      const s = walker.currentNode.nodeValue;
      if (s && /\\ref\{[^}]+\}/.test(s)) targets.push(walker.currentNode);
    }
    targets.forEach(node => {
      const span = document.createElement('span');
      span.innerHTML = node.nodeValue.replace(/\\ref\{([^}]+)\}/g, (_, id) => {
        if (refMap.has(id)){ const r = refMap.get(id); return `#${r.id}${r.text}</a>`; }
        return `\\ref{${id}}`; // leave (likely equation or unresolved)
      });
      node.parentNode.replaceChild(span, node);
    });
  }

  async function typesetPerSection(blocks){
    if (!window.MathJax || !MathJax.typesetPromise){ log('MathJax not ready'); return; }
    for (const w of blocks){
      MathJax.config._currentSection = parseInt(w.dataset.sec, 10) || 0;
      await MathJax.typesetPromise([w]);
    }
  }

  // ---------- main ----------
  document.addEventListener('DOMContentLoaded', async () => {
    try{
      const root = contentRoot();
      const saved = protectCode(root);

      const blocks = wrapSections(root);
      for (const w of blocks){
        const secNo = parseInt(w.dataset.sec, 10) || 1;
        processSection(w, secNo);
      }

      restoreCode(root, saved);

      await typesetPerSection(blocks);
      rewriteTextRefs(root);
      log('Done.');
    } catch (e){
      console.error('[latex-math] error:', e);
    }
  });
})();
</script>

section.definition, section.remark, section.example, section.proof {

  background: #f9fffc;
  padding: .75rem 1rem;

}
section.proof { border-color:#888; background:#fbfbfb; }
.thm-heading { font-weight: 600; margin-bottom: .35rem; }
