<!-- MathJax v4: config FIRST -->
<script>
  window.MathJax = {
    loader: { load: ['[tex]/tagformat'] },
    tex: {
      packages: ['base', 'ams', 'tagformat'],
      tags: 'ams',
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      tagformat: {
        number: (n) => (MathJax.config._currentSection || 0) + '.' + n,
        id: (tag) => 'eqn-' + tag
      }
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
    },
    startup: {
      // Allow MathJax to initialize but don't typeset until we call it
      ready: () => {
        MathJax.startup.defaultReady();
        // Don't call typeset() here
      }
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
