 <script defer src="{{ site.github.url }}/assets/libs/fontawesome/all.min.js"></script>

<script>
window.MathJax = {
  // CRITICAL FIX: The top-level blocks must be siblings, not nested
  tex: {
    // Redundant packages kept for clarity, but not strictly needed for standard components
    loader: {load: ['a11y/assistive-mml']},
    packages: {'[+]': ['ams','base', 'newcommand', 'configMacros', 'html']}, 
    tags: 'ams',
    inlineMath: [ ['@@@', '@@@'],["$","$"]],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true,
    macros: { 
      // FIX: All backslashes are properly double-escaped
      R: "\\\mathbb{R}",
      N: "\\\mathbb{N}",
      cal: "\\\mathcal"
    }
  }, 
  chtml: {
    displayAlign: 'center',
    displayIndent: '0em'
  },
  
  options: {
    ignoreHtmlClass: 'tex2jax_ignore',
    processHtmlClass: 'tex2jax_process',
    skipHtmlTags: ['script','noscript','style','textarea','pre','code'],
    enableMenu: true,
    menuSettings: {
      semantics: true
    }
  }
};
</script>
